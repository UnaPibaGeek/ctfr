[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctfr"
version = "1.3.0"
description = "Discover subdomains through Certificate Transparency logs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-only" }
authors = [{ name = "Sheila A. Berta" }]
dependencies = ["requests>=2.32.0,<3.0.0"]

[project.scripts]
ctfr = "ctfr:main"

[tool.setuptools]
py-modules = ["ctfr"]
